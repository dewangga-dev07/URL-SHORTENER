name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shortener:shortener@localhost:5432/shortener
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4
      - name: Pasang python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install dependenci
        run: |
          pip install -r app/requirements.txt
          pip install ruff
      - name: linter
        run: ruff check app
      - name: Jalankan test
        working-directory: app
        run: python -m pytest -v
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: checkout kode
        uses: actions/checkout@v4
      - name: login docker hub
        uses: docker/login-actions@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: setup buildx
        uses: docker/setup-buildx-action@v3
      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{secrets.DOCKERHUB_USERNAME}}/url-shortener:latest
            ${{secrets.DOCKERHUB_USERNAME}}/url-shortener:${{github.sha}}
